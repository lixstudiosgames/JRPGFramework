<!-- ============ SEÇÃO: MENU DE COMANDOS DA LUTA (placeholder) ============
     Aparece SÓ na fase de comandos de cada rodada (o C++ abre com JRPGBattle.open() e fecha com
     JRPGBattle.close() quando a rodada toca). O JS não decide nada: o C++ manda a view inteira a cada
     passo (JRPGBattle.render) e este arquivo só a desenha. Contrato em Docs/Guides/WEBUI_API.md.

     O d-pad (#bt-dpad) é um bloco ISOLADO: quem o desenha é 95_battle_dpad.js. Para trocar pelos botões
     3D ao lado do personagem, é esse arquivo (e o 95_battle_dpad.css) que sai; o resto da tela não muda.

     Tudo dentro de #bt-stage é o canvas 1920x1080 escalado por --scale-factor; o rodapé de atalhos fica
     FORA dele (position:fixed dentro de transform ancora no elemento, não no viewport). -->
<div id="screen-battle" class="ui-section">
    <div id="bt-stage" data-screen="start">

        <div id="bt-crumbs"></div>
        <div id="bt-auto"></div>

        <div id="bt-escape-text">Run away from this battle?</div>
        <div id="bt-dpad" data-pos="center"></div>

        <div id="bt-targets">
            <div id="bt-targets-title">Choose a target</div>
            <div id="bt-targets-list"></div>
        </div>

        <div id="bt-tactics" class="jrpg-card">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <div id="bt-tactics-title">TACTICS</div>
            <div id="bt-tactics-sub">Each hero fights on their own, the way you pick.</div>
            <div id="bt-tactics-rows"></div>
            <div id="bt-tactics-confirm" class="bt-btn">Confirm</div>
        </div>

        <div id="bt-final">
            <div id="bt-final-rows"></div>
        </div>

        <!-- A lista de consulta das Arts (o painel do Triângulo do original): abre e fecha com Triângulo / E, L1 / R1 (Q / R)
             trocam a página. Só desenha o que a view traz (view.artlist); o direcional continua digitando com ela aberta. -->
        <div id="bt-artlist"></div>

        <!-- As setas do painel de Arts: roxa (#8C88EC) e amarela (#F4B41A), com a sombra escura embaixo à direita, nas quatro
             direções (a mesma seta girada em volta do centro; a sombra fica sempre do mesmo lado). Uso: <use href="#ar-up-y"/> -->
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
                <symbol id="ar-up-y" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#F4B41A"/>
                </symbol>
                <symbol id="ar-up-p" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#8C88EC"/>
                </symbol>
                <symbol id="ar-right-y" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(90 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#F4B41A" transform="rotate(90 8 8)"/>
                </symbol>
                <symbol id="ar-right-p" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(90 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#8C88EC" transform="rotate(90 8 8)"/>
                </symbol>
                <symbol id="ar-down-y" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(180 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#F4B41A" transform="rotate(180 8 8)"/>
                </symbol>
                <symbol id="ar-down-p" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(180 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#8C88EC" transform="rotate(180 8 8)"/>
                </symbol>
                <symbol id="ar-left-y" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(270 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#F4B41A" transform="rotate(270 8 8)"/>
                </symbol>
                <symbol id="ar-left-p" viewBox="0 0 20 20">
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#111111" transform="translate(2,2) rotate(270 8 8)"/>
                    <path d="M 8,0 L 16,8 L 11,8 L 11,16 L 5,16 L 5,8 L 0,8 Z" fill="#8C88EC" transform="rotate(270 8 8)"/>
                </symbol>
            </defs>
        </svg>

        <div id="bt-refusal"></div>
        <div id="bt-art"></div>
        <div id="bt-party"></div>
    </div>

    <div class="jrpg-hints">
        <div id="bt-hints" class="jrpg-hints-row">
            <span class="sl-hint"><span class="key-badge">&#9664;&#9650;&#9654;&#9660;</span> Choose</span>
            <span class="sl-hint"><span class="key-badge">Enter</span> Confirm</span>
            <span class="sl-hint"><span class="key-badge">Esc</span> Back</span>
        </div>
    </div>
</div>
