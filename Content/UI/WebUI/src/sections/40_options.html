<!-- ============ SEÇÃO: OPÇÕES ============ -->
<div id="screen-options" class="ui-section">

    <!-- Fundo próprio da tela de opções. FICA FORA do canvas 1920x1080 escalado
         (position: fixed) para cobrir o viewport inteiro em qualquer aspect ratio.
         É a ÚNICA tela do shell com background — o main menu é transparente. -->
    <div id="options-bg">
        <div id="options-particles">
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-particle"></span><span class="opt-particle"></span>
            <span class="opt-ember"></span><span class="opt-ember"></span>
            <span class="opt-ember"></span><span class="opt-ember"></span>
        </div>
        <div id="options-vignette"></div>
    </div>

    <div id="options-layout" style="opacity: 0; transition: opacity 0.28s ease;">

        <!-- Abas superiores (sem título: as abas já dizem onde o jogador está) -->
        <div id="options-header">
            <div id="options-tabbar">
                <span class="opt-tab-arrow arrow-left">&#9664;</span>
                <div id="options-tabs">
                    <div class="opt-tab selected" data-tab="display">Display</div>
                    <div class="opt-tab" data-tab="audio">Audio</div>
                    <div class="opt-tab" data-tab="game">Game</div>
                    <div class="opt-tab" data-tab="controller">Controller</div>
                    <div class="opt-tab" data-tab="keybindings">Keybindings</div>
                </div>
                <span class="opt-tab-arrow arrow-right">&#9654;</span>
            </div>
            <!-- Limitador discreto (o flare fica embaixo do texto da aba) -->
            <div id="options-header-rule"></div>
        </div>

        <!-- Corpo: lista de settings (esquerda) + painel de descrição (direita) -->
        <div id="options-body">

            <div id="options-list" class="jrpg-card">
                <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

                <!-- Grupos e linhas gerados pelo JS (40_options.js) -->
                <div id="options-rows"></div>
            </div>

            <div id="options-desc" class="jrpg-card">
                <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

                <div id="options-desc-title">Display</div>
                <div id="options-desc-rule"></div>
                <div id="options-desc-text">Select an option to see its description.</div>
            </div>

        </div>

        <!-- Atalhos de navegação (rodapé) -->
        </div>

    

    <!-- Atalhos de navegação: FICAM FORA do layout escalado.
    O position:fixed do .jrpg-hints ancora no viewport, e dentro de um
    elemento com transform ele ancoraria no próprio layout. -->
    <div class="jrpg-hints">
    <div id="options-hints" class="jrpg-hints-row">
    <span class="opt-hint"><span class="key-badge">Q</span><span class="key-badge">E</span> Switch Tab</span>
    <span class="opt-hint"><span class="key-badge">&#8593;&#8595;</span> Navigate</span>
    <span class="opt-hint"><span class="key-badge">&#9664;&#9654;</span> Change</span>
    <span class="opt-hint"><span class="key-badge">Esc</span> Back</span>
    </div>
    </div>
</div>
