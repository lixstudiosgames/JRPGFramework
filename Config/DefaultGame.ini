; ============================================================================
; Config do plugin JRPGFramework — mesclado na hierarquia de config do projeto
; que o habilita. O RunUAT BuildPlugin copia a pasta Config/ junto, então esta
; regra viaja com o plugin e o CODE continua sendo a única fonte de verdade.
; ============================================================================

[/Script/UnrealEd.ProjectPackagingSettings]
; UWebUIBridge::PlaySFX carrega os sons por STRING
; (StaticLoadObject em "/JRPGFramework/UI/SFX/<nome>"), então o cooker não vê
; referência nenhuma e, com bCookAll=False, os assets ficam FORA do pacote —
; sintoma: "WebUIBridge: Falha ao carregar efeito sonoro nativo".
; Toda pasta de asset do plugin carregada por caminho precisa da própria entrada.
; O operador '+' é add-único, então repetir isto no DefaultGame.ini do projeto
; não duplica a entrada.
+DirectoriesToAlwaysCook=(Path="/JRPGFramework/UI/SFX")
